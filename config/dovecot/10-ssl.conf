# Self-signed Zertifikat wird beim ersten Start erzeugt (siehe scripts/generate-ssl.sh)
# Für Produktion kannst du eigene Zertifikate (Let's Encrypt o.ä.) einbinden.

ssl = required
ssl_cert = </etc/dovecot/ssl/dovecot.pem
ssl_key = </etc/dovecot/ssl/dovecot.key

# Moderne, aber kompatible Cipher-Suite
ssl_min_protocol = TLSv1.2
ssl_cipher_list = EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH
ssl_prefer_server_ciphers = yes
