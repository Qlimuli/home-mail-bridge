# Authentifizierung über Passwortdatei (wird von der GUI gepflegt)
# Format: user:{BLF-CRYPT}$2b$12$...:uid:gid::/homes/username::
# bcrypt (BLF-CRYPT) – Passwörter liegen niemals im Klartext vor

disable_plaintext_auth = no   # STARTTLS/IMAPS wird von Clients erwartet

passdb {
  driver = passwd-file
  # Kein festes scheme= – Dovecot erkennt {BLF-CRYPT} automatisch aus dem Hash-Prefix
  args = username_format=%u /etc/dovecot/users/passwd
}

userdb {
  driver = passwd-file
  args = username_format=%u /etc/dovecot/users/passwd
  # Home und UID/GID kommen aus der passwd-Datei / default_fields
  default_fields = uid=1000 gid=1000
}
