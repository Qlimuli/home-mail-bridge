# Minimale Haupt-Konfiguration für das offizielle Dovecot-Image
# Die Dateien in conf.d/ werden automatisch geladen, wenn wir sie richtig mounten.

dovecot_config_version = 2.3.21
dovecot_storage_version = 2.3.21

# Protokolle – nur IMAP (kein POP3/POP3S)
# POP3 würde Port 995 belegen, der auf Synology DSM häufig schon belegt ist.
protocols = imap

# Logging
log_path = /dev/stderr
info_log_path = /dev/stderr
debug_log_path = /dev/null

# Auth-Worker
service auth {
  unix_listener auth-userdb {
    mode = 0666
  }
}

# SSL wird in 10-ssl.conf gesetzt
# Mail-Location in 10-mail.conf
# Auth in 10-auth.conf

# Einbinden der conf.d-Dateien (falls das Image es nicht von allein macht)
!include conf.d/*.conf
!include_try local.conf
