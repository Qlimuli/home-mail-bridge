# Mail-Location: echte Home-.Maildir (kompatibel mit altem Synology Mail Server)
# %h = Home des Users (wird aus userdb gesetzt)
mail_location = maildir:%h/.Maildir

# Indexe und Control-Dateien ebenfalls im Home (einfach, kein extra Volume nötig)
# Bei extrem wenig RAM und vielen Mails kann man INDEX später auslagern
mail_uid = 1000
mail_gid = 1000

# Maildir++ Layout (Standard, kompatibel mit den meisten Clients und altem Synology)
# Falls du hierarchische Ordner bevorzugst: LAYOUT=fs hinzufügen
# mail_location = maildir:%h/.Maildir:LAYOUT=fs

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }
  mailbox Junk {
    auto = subscribe
    special_use = \Junk
  }
  mailbox Archive {
    auto = subscribe
    special_use = \Archive
  }
}

# Performance-Optimierungen für schwache Hardware
maildir_very_dirty_syncs = yes
maildir_copy_with_hardlinks = yes
mail_max_userip_connections = 20
protocol imap {
  mail_max_userip_connections = 20
}
